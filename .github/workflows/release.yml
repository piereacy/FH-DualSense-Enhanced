name: release

# Triggers:
#   - tag RN or commit msg contains "release RN" -> stable R-series release
#   - tag vX.Y.Z or vX.Y.Z.postN                  -> legacy stable release
#   - legacy "release vX.Y.Z[.postN]" commits     -> legacy stable release
#   - commit msg contains "prerelease" or manual dispatch -> rolling RN-preview

on:
  push:
    branches: [main, dev]
    tags: ["R*", "v*.*.*"]
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to publish
        required: true
        default: preview
        type: choice
        options:
          - preview
          - stable

permissions:
  contents: write

jobs:
  # MARK: parse trigger + move rolling tag --------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      title: ${{ steps.parse.outputs.title }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Parse trigger
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          set -e
          tag=""; prerelease=""; title=""
          msg=$(git log -1 --pretty=%s)
          internal=$(sed -n 's/^version = "\([^"]*\)"/\1/p' src/pyproject.toml | head -1)
          if [[ ! "$internal" =~ ^[0-9]+$ ]]; then
            echo "Expected a numeric internal project version, got: $internal" >&2
            exit 1
          fi
          release="R$internal"

          if [[ "$GITHUB_REF" =~ ^refs/tags/(R[0-9]+)$ ]]; then
            # R-series tag push -> stable
            tag="${BASH_REMATCH[1]}"; prerelease=false
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # legacy tag push -> stable
            tag="${GITHUB_REF#refs/tags/}"; prerelease=false; title="$tag"
          elif [[ "$msg" =~ release[[:space:]]+(R[0-9]+) ]]; then
            # explicit R-series stable release commit
            tag="${BASH_REMATCH[1]}"; prerelease=false
          elif [[ "$msg" =~ release[[:space:]]+(v[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?) ]]; then
            # explicit legacy stable release commit
            tag="${BASH_REMATCH[1]}"; prerelease=false; title="$tag"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "$RELEASE_CHANNEL" == "stable" ]]; then
            # explicit manual recovery path when repository push events are unavailable
            tag="$release"; prerelease=false
          elif [[ "$msg" == *prerelease* || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # rolling prerelease for the current R-series version
            tag="${release}-preview"
            prerelease=true; title="FH-DualSense-Enhanced ${release} Preview"
          fi

          if [[ "$tag" =~ ^R([0-9]+)(-preview)?$ ]]; then
            requested="${BASH_REMATCH[1]}"
            if [[ "$requested" != "$internal" ]]; then
              echo "Refusing $tag: src/pyproject.toml declares R$internal" >&2
              exit 1
            fi
            if ! grep -Fq "## Enhanced R$internal 中文说明" .github/workflows/release.yml \
              || ! grep -Fq "## Enhanced R$internal English notes" .github/workflows/release.yml; then
              echo "Refusing $tag: bilingual release notes are not prepared for R$internal" >&2
              exit 1
            fi
          fi

          if [[ "$tag" =~ ^R[0-9]+$ ]]; then
            title="FH-DualSense-Enhanced $tag"
          elif [[ "$tag" == "v1.6.2.post1" ]]; then
            title="FH-DualSense-Enhanced 1.6.2 Enhanced R1"
          elif [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)\.post([0-9]+)$ ]]; then
            title="FH-DualSense-Enhanced ${BASH_REMATCH[1]} Enhanced R${BASH_REMATCH[2]}"
          fi

          echo "tag=$tag"               >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "title=$title"           >> "$GITHUB_OUTPUT"

      - name: Move rolling tag
        if: steps.parse.outputs.tag && steps.parse.outputs.prerelease == 'true'
        env:
          TAG: ${{ steps.parse.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin "refs/tags/$TAG" --force

  # MARK: zuv bundle ------------------------------------------------------
  bundle:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.tag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Build zuv bundle
        run: |
          mkdir -p release
          uvx --from "zuv==0.5.6" zuv build src -o release/FH-DualSense-Enhanced.zuv.py \
            --update-repo "$GITHUB_REPOSITORY"
          cp win_start.bat linux_start.sh LICENSE docs/THIRD_PARTY_NOTICES.md release/

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: release/

  # MARK: Windows standalone EXE -----------------------------------------
  exe:
    runs-on: windows-latest
    needs: prepare
    if: needs.prepare.outputs.tag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Build FH-DualSense-Enhanced EXE
        shell: pwsh
        run: |
          & "$Env:GITHUB_WORKSPACE\packaging\windows\build_exe.bat"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify EXE checksum sidecar
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "$Env:GITHUB_WORKSPACE\packaging\windows\dist\FH-DualSense-Enhanced-R*.exe")
          if ($files.Count -ne 1) { throw "Expected one canonical R-series EXE, found $($files.Count)" }
          uv run --no-project python "$Env:GITHUB_WORKSPACE\packaging\windows\write_sha256.py" --check $files[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: |
            packaging/windows/dist/FH-DualSense-Enhanced-*.exe
            packaging/windows/dist/FH-DualSense-Enhanced-*.exe.sha256

  # MARK: Linux standalone ELF -------------------------------------------
  elf:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.tag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # AppIndicator/GTK so the pystray tray works in the frozen build.
      - name: Install system tray libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gir1.2-ayatanaappindicator3-0.1 \
            python3-gi gir1.2-gtk-3.0 libportaudio2

      - name: Build FH-DualSense-Enhanced (ELF)
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          internal=$(sed -n 's/^version = "\([^"]*\)"/\1/p' src/pyproject.toml | head -1)
          bash "$GITHUB_WORKSPACE/packaging/linux/build_elf.sh"
          built="$GITHUB_WORKSPACE/packaging/linux/dist/FH-DualSense-Enhanced-R$internal"
          target="$GITHUB_WORKSPACE/packaging/linux/dist/FH-DualSense-Enhanced-$tag"
          if [[ "$built" != "$target" ]]; then
            mv "$built" "$target"
          fi
          echo "Built packaging/linux/dist/FH-DualSense-Enhanced-$tag"

      - uses: actions/upload-artifact@v4
        with:
          name: elf
          path: packaging/linux/dist/FH-DualSense-Enhanced-*

  # MARK: combined release -----------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [prepare, bundle, exe, elf]
    if: needs.prepare.outputs.tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: elf
          path: release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.title }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: false
          body: |
            ## Enhanced R11 中文说明

            Enhanced R11 重点改进 Xbox App 输入、触觉预览和本地诊断能力。

            ### 更新内容

            - **手柄占用范围**：FHDS 运行期间会继续使用当前实体 DualSense，切到桌面或其他游戏不会自动释放。其他游戏或手柄工具需要同一只 DualSense 时，请先退出 FHDS；本版不包含“仅在地平线位于前台时占用手柄”的试验行为。
            - **Xbox App 输入升级**：虚拟手柄可按最近主动输入在键鼠与 DualSense 之间热切换，保持玩家槽位并增强异常后的自动恢复。可选的 HidHide 1.7+ 会话隔离仍默认关闭，需要用户另行安装 HidHide，并先在官方 Configuration Client 中开启 Device hiding。
            - **体感到摇杆**：Xbox App 自定义映射新增 Steam Input 风格的 Camera 与 Deflection 模式，可选择左右摇杆、激活键、方向、死区和平滑。X360 没有原生陀螺仪通道，因此该功能只生成摇杆输出，并且必须同时开启自定义 Xbox 映射总开关和默认关闭的陀螺仪子开关。
            - **Haptics Lab 与本地诊断**：系统与更新页新增默认折叠的 Haptics Lab 小卡片，可进行有界的扳机/握把场景预览；同时支持一键导出脱敏诊断 ZIP，诊断包只保存在本机，不会自动上传。
            - **默认调教与鸣谢**：新的 `Default` 采用社区调教并默认开启 ABS；升级时旧 `Default` 会保留为 `Default before R11`，`Original` 保持上游风格。关于与许可证页新增“调教鸣谢：Bilibili 开心散仙”链接。
            - **输入与稳定性**：加强 Bluetooth 输入、虚拟手柄、Raw Input 热切换和异常后的恢复；Haptics Lab 会在有效游戏遥测到达时自动停止。

            ### Windows 独立 EXE（推荐）

            下载 `${{ format('FH-DualSense-Enhanced-{0}.exe', needs.prepare.outputs.tag) }}`。EXE 已包含 Python 和全部运行依赖。

            ### ZUV / Linux 备用方式

            Windows 可使用 `win_start.bat`，Linux 可使用 `linux_start.sh`，也可以手动下载 `FH-DualSense-Enhanced.zuv.py`。Linux 独立文件为 `${{ format('FH-DualSense-Enhanced-{0}', needs.prepare.outputs.tag) }}`；内置 EXE 更新只支持 Windows 独立版。
            Linux 上若遇到 HID 权限不足，请按仓库中的 [`70-dualsense.rules`](https://github.com/piereacy/FH-DualSense-Enhanced/blob/main/packaging/linux/70-dualsense.rules) 配置 udev 权限。

            ### 基本设置

            - 在 Forza Horizon 中开启 Data Out，设置为 `127.0.0.1:5300`，并关闭游戏内振动。
            - Xbox App 版请在软件内选择 `XBOX 版`，并避免同时让 Steam Input 或 DS4Windows 接管手柄。

            ## Enhanced R11 English notes

            Enhanced R11 focuses on Xbox App input, haptic previews, and local diagnostics.

            ### What's new

            - **Controller usage scope**: FHDS continues using the selected physical DualSense while the app is running, so switching to the desktop or another game does not release it. Exit FHDS first when another game or controller tool needs the same DualSense; this release does not include the experimental foreground-Forza-only ownership behavior.
            - **Xbox App input upgrades**: the virtual controller can hand off between keyboard/mouse and DualSense according to the latest deliberate input, retain its player slot, and recover more reliably after transient failures. Optional HidHide 1.7+ session isolation remains off by default, requires a separate HidHide installation, and requires Device hiding to be enabled first in the official Configuration Client.
            - **Motion-to-stick mapping**: Xbox App custom mapping adds Steam Input-style Camera and Deflection modes with stick, activation, direction, deadzone, and smoothing controls. X360 has no native gyro channel, so this feature produces stick output only and requires both the custom Xbox mapping master switch and its separate gyro switch, which is off by default.
            - **Haptics Lab and local diagnostics**: a compact Haptics Lab card, collapsed by default under System and updates, provides bounded trigger/grip scene previews. One-click sanitized diagnostic ZIP export is also available; packages stay on the local computer and are never uploaded automatically.
            - **Default tuning and credit**: the new community-tuned `Default` enables ABS. Upgrades preserve the prior `Default` as `Default before R11`, while `Original` keeps its upstream-style behavior. About and licenses now links the tuning credit for Bilibili 开心散仙.
            - **Input and stability**: recovery is strengthened across Bluetooth input, the virtual controller, and Raw Input hand-off. Haptics Lab also stops automatically when valid game telemetry arrives.

            ### Windows standalone EXE (recommended)

            Download `${{ format('FH-DualSense-Enhanced-{0}.exe', needs.prepare.outputs.tag) }}`. It includes Python and all runtime dependencies.

            ### ZUV / Linux fallback

            Windows users may use `win_start.bat`, Linux users may use `linux_start.sh`, or either platform may download `FH-DualSense-Enhanced.zuv.py` manually. The standalone Linux asset is `${{ format('FH-DualSense-Enhanced-{0}', needs.prepare.outputs.tag) }}`. Built-in EXE replacement is available only in the Windows standalone build.
            On Linux, if HID access is denied, configure udev permissions with [`70-dualsense.rules`](https://github.com/piereacy/FH-DualSense-Enhanced/blob/main/packaging/linux/70-dualsense.rules).

            ### Basic setup

            - Enable Forza Data Out at `127.0.0.1:5300` and disable in-game vibration.
            - For Xbox App, select `Xbox App` inside FH-DualSense-Enhanced and do not let Steam Input or DS4Windows claim the controller at the same time.
          files: release/*

