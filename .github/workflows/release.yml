name: release

# Triggers:
#   - tag RN or commit msg contains "release RN" -> stable R-series release
#   - tag vX.Y.Z or vX.Y.Z.postN                  -> legacy stable release
#   - legacy "release vX.Y.Z[.postN]" commits     -> legacy stable release
#   - commit msg contains "prerelease" or manual dispatch -> rolling RN-preview

on:
  push:
    branches: [main, dev]
    tags: ["R*", "v*.*.*"]
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to publish
        required: true
        default: preview
        type: choice
        options:
          - preview
          - stable

permissions:
  contents: write

jobs:
  # MARK: parse trigger + move rolling tag --------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      title: ${{ steps.parse.outputs.title }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Parse trigger
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          set -e
          tag=""; prerelease=""; title=""
          msg=$(git log -1 --pretty=%s)
          internal=$(sed -n 's/^version = "\([^"]*\)"/\1/p' src/pyproject.toml | head -1)
          if [[ ! "$internal" =~ ^[0-9]+$ ]]; then
            echo "Expected a numeric internal project version, got: $internal" >&2
            exit 1
          fi
          release="R$internal"

          if [[ "$GITHUB_REF" =~ ^refs/tags/(R[0-9]+)$ ]]; then
            # R-series tag push -> stable
            tag="${BASH_REMATCH[1]}"; prerelease=false
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # legacy tag push -> stable
            tag="${GITHUB_REF#refs/tags/}"; prerelease=false; title="$tag"
          elif [[ "$msg" =~ release[[:space:]]+(R[0-9]+) ]]; then
            # explicit R-series stable release commit
            tag="${BASH_REMATCH[1]}"; prerelease=false
          elif [[ "$msg" =~ release[[:space:]]+(v[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?) ]]; then
            # explicit legacy stable release commit
            tag="${BASH_REMATCH[1]}"; prerelease=false; title="$tag"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "$RELEASE_CHANNEL" == "stable" ]]; then
            # explicit manual recovery path when repository push events are unavailable
            tag="$release"; prerelease=false
          elif [[ "$msg" == *prerelease* || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # rolling prerelease for the current R-series version
            tag="${release}-preview"
            prerelease=true; title="FH-DualSense-Enhanced ${release} Preview"
          fi

          if [[ "$tag" =~ ^R([0-9]+)(-preview)?$ ]]; then
            requested="${BASH_REMATCH[1]}"
            if [[ "$requested" != "$internal" ]]; then
              echo "Refusing $tag: src/pyproject.toml declares R$internal" >&2
              exit 1
            fi
            if ! grep -Fq "## Enhanced R$internal 中文说明" .github/workflows/release.yml \
              || ! grep -Fq "## Enhanced R$internal English notes" .github/workflows/release.yml; then
              echo "Refusing $tag: bilingual release notes are not prepared for R$internal" >&2
              exit 1
            fi
          fi

          if [[ "$tag" =~ ^R[0-9]+$ ]]; then
            title="FH-DualSense-Enhanced $tag"
          elif [[ "$tag" == "v1.6.2.post1" ]]; then
            title="FH-DualSense-Enhanced 1.6.2 Enhanced R1"
          elif [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)\.post([0-9]+)$ ]]; then
            title="FH-DualSense-Enhanced ${BASH_REMATCH[1]} Enhanced R${BASH_REMATCH[2]}"
          fi

          echo "tag=$tag"               >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "title=$title"           >> "$GITHUB_OUTPUT"

      - name: Move rolling tag
        if: steps.parse.outputs.tag && steps.parse.outputs.prerelease == 'true'
        env:
          TAG: ${{ steps.parse.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin "refs/tags/$TAG" --force

  # MARK: zuv bundle ------------------------------------------------------
  bundle:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.tag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Build zuv bundle
        run: |
          mkdir -p release
          uvx --from "zuv==0.5.6" zuv build src -o release/FH-DualSense-Enhanced.zuv.py \
            --update-repo "$GITHUB_REPOSITORY"
          cp win_start.bat linux_start.sh LICENSE docs/THIRD_PARTY_NOTICES.md release/

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: release/

  # MARK: Windows standalone EXE -----------------------------------------
  exe:
    runs-on: windows-latest
    needs: prepare
    if: needs.prepare.outputs.tag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Build FH-DualSense-Enhanced EXE
        shell: pwsh
        run: |
          & "$Env:GITHUB_WORKSPACE\packaging\windows\build_exe.bat"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify EXE checksum sidecar
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "$Env:GITHUB_WORKSPACE\packaging\windows\dist\FH-DualSense-Enhanced-R*.exe")
          if ($files.Count -ne 1) { throw "Expected one canonical R-series EXE, found $($files.Count)" }
          uv run --no-project python "$Env:GITHUB_WORKSPACE\packaging\windows\write_sha256.py" --check $files[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: |
            packaging/windows/dist/FH-DualSense-Enhanced-*.exe
            packaging/windows/dist/FH-DualSense-Enhanced-*.exe.sha256

  # MARK: Linux standalone ELF -------------------------------------------
  elf:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.tag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # AppIndicator/GTK so the pystray tray works in the frozen build.
      - name: Install system tray libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gir1.2-ayatanaappindicator3-0.1 \
            python3-gi gir1.2-gtk-3.0 libportaudio2

      - name: Build FH-DualSense-Enhanced (ELF)
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          internal=$(sed -n 's/^version = "\([^"]*\)"/\1/p' src/pyproject.toml | head -1)
          bash "$GITHUB_WORKSPACE/packaging/linux/build_elf.sh"
          built="$GITHUB_WORKSPACE/packaging/linux/dist/FH-DualSense-Enhanced-R$internal"
          target="$GITHUB_WORKSPACE/packaging/linux/dist/FH-DualSense-Enhanced-$tag"
          if [[ "$built" != "$target" ]]; then
            mv "$built" "$target"
          fi
          echo "Built packaging/linux/dist/FH-DualSense-Enhanced-$tag"

      - uses: actions/upload-artifact@v4
        with:
          name: elf
          path: packaging/linux/dist/FH-DualSense-Enhanced-*

  # MARK: combined release -----------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [prepare, bundle, exe, elf]
    if: needs.prepare.outputs.tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: elf
          path: release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.title }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: false
          body: |
            ## Enhanced R8 中文说明

            Enhanced R8 重点修复扳机无法完全释放、红线提示偏早、界面文字裁切和旧版更新残留。

            ### 更新内容

            - **扳机可以真正关闭**：关闭 `Brake stiffness` 或 `Throttle stiffness` 后，对应扳机不再在约 89% 行程留下硬阻力。新增 `启用自适应扳机输出` 总开关，可以立即释放 L2/R2，并保留已有子设置。
            - **红线反馈更自然**：燃油车会学习实际断油转速，默认提醒由 `93%` 后移到 `95%`；已自定义的时机和命名 Profile 不会被覆盖。R2 扳机键、握把和转速灯条保持同步。全部电动车不再输出红线震动，灯条仍会在接近极限时稳定变红。
            - **界面排版修正**：扳机与握把页面重新排布，说明文字在双列、窗口缩放和高 DPI 环境下不再被截断。
            - **自动更新修正**：连续从旧版升级时会恢复正确的 `FH-DualSense-Enhanced-R8.exe` 文件名，并清理确认属于旧版本的 EXE、`.old` 和校验文件；无关文件不会被删除。

            ### Windows 独立 EXE（推荐）

            下载 `${{ format('FH-DualSense-Enhanced-{0}.exe', needs.prepare.outputs.tag) }}`。EXE 已包含 Python 和全部运行依赖。配套 `.sha256` 由内置更新器使用，手动启动 EXE 时不需要另外下载。

            ### ZUV / Linux 备用方式

            Windows 可使用 `win_start.bat`，Linux 可使用 `linux_start.sh`，也可以手动下载 `FH-DualSense-Enhanced.zuv.py`。Linux 独立文件为 `${{ format('FH-DualSense-Enhanced-{0}', needs.prepare.outputs.tag) }}`；内置 EXE 更新只支持 Windows 独立版。

            ### 必要设置

            - Steam 版保持 Steam Input 与 DualSense vibration 开启；Xbox App 版在软件内选择 Xbox App，不要同时让 Steam Input 或 DS4Windows 接管手柄。
            - 在 Forza Horizon 中开启 Data Out，设置为 `127.0.0.1:5300`，并关闭游戏内振动。
            - 若要完全释放 L2/R2，请关闭 `启用自适应扳机输出`；握把触觉需要在 `Grip haptics` 页面单独关闭。
            - 收不到遥测时，请在防火墙中允许本程序和 UDP 5300。

            ---
            > - 设置保存在程序旁边的 `data/user_preferences.json`，更新后继续保留。
            > - Linux 启动器不会安装 udev 规则。HID 权限不足时，请下载 [`70-dualsense.rules`](https://github.com/piereacy/FH-DualSense-Enhanced/blob/main/packaging/linux/70-dualsense.rules)，复制到 `/etc/udev/rules.d/`，重新载入规则后连接手柄。
            > - 预发布频道仍可通过 `uv run FH-DualSense-Enhanced.zuv.py --prerelease` 跟踪。

            ## Enhanced R8 English notes

            Enhanced R8 focuses on triggers that would not fully release, early redline warnings, clipped interface text, and leftovers from legacy updates.

            ### What's new

            - **Trigger feedback can be fully disabled**: after turning off `Brake stiffness` or `Throttle stiffness`, the corresponding trigger no longer keeps hard resistance around 89% travel. The new `Enable adaptive trigger output` master switch releases L2/R2 immediately while preserving existing child settings.
            - **More natural redline feedback**: combustion cars learn their actual fuel-cut RPM, and the default warning moves later from `93%` to `95%`. Custom timing and named profiles are preserved. R2, grip haptics, and the tachometer lightbar stay synchronized. Electric vehicles no longer produce redline vibration, while the lightbar still turns steadily red near the limit.
            - **Layout fixes**: the Trigger feedback and Grip haptics pages have been rearranged, and helper text no longer clips in two-column, resized, or high-DPI layouts.
            - **Updater fixes**: repeated upgrades from older versions restore the correct `FH-DualSense-Enhanced-R8.exe` filename and remove confirmed old-version EXEs, `.old` files, and checksum files. Unrelated files are not deleted.

            ### Windows standalone EXE (recommended)

            Download `${{ format('FH-DualSense-Enhanced-{0}.exe', needs.prepare.outputs.tag) }}`. It includes Python and all runtime dependencies. The matching `.sha256` is used by the built-in updater and is not required for manual launches.

            ### ZUV / Linux fallback

            Windows users may use `win_start.bat`, Linux users may use `linux_start.sh`, or either platform may download `FH-DualSense-Enhanced.zuv.py` manually. The standalone Linux asset is `${{ format('FH-DualSense-Enhanced-{0}', needs.prepare.outputs.tag) }}`. Built-in EXE replacement is available only in the Windows standalone build.

            ### Required settings

            - On Steam, keep Steam Input and DualSense vibration enabled. For Xbox App, select Xbox App inside FH-DualSense-Enhanced and do not let Steam Input or DS4Windows claim the controller at the same time.
            - Enable Forza Data Out at `127.0.0.1:5300` and disable in-game vibration.
            - To release L2/R2 completely, disable `Enable adaptive trigger output`; Grip haptics must be disabled separately.
            - If telemetry does not arrive, allow the app and UDP 5300 through Windows Firewall.

            ---
            > - Settings are stored in `data/user_preferences.json` beside the executable and remain across updates.
            > - The Linux launcher does not install udev rules. If HID access is denied, download [`70-dualsense.rules`](https://github.com/piereacy/FH-DualSense-Enhanced/blob/main/packaging/linux/70-dualsense.rules), copy it to `/etc/udev/rules.d/`, reload the rules, and reconnect the controller.
            > - The preview channel remains available through `uv run FH-DualSense-Enhanced.zuv.py --prerelease`.
          files: release/*

