name: release

# Triggers:
#   - tag RN or commit msg contains "release RN" -> stable R-series release
#   - tag vX.Y.Z or vX.Y.Z.postN                  -> legacy stable release
#   - legacy "release vX.Y.Z[.postN]" commits     -> legacy stable release
#   - commit msg contains "prerelease"          -> rolling RN-preview
#   - manual dispatch                          -> explicit selected channel

on:
  push:
    branches: [main, dev]
    tags: ["R*", "v*.*.*"]
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to publish
        required: true
        default: preview
        type: choice
        options:
          - preview
          - stable

permissions:
  contents: write

jobs:
  # MARK: parse trigger + move rolling tag --------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      title: ${{ steps.parse.outputs.title }}
      windows_asset: ${{ steps.parse.outputs.windows_asset }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Parse trigger
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          set -e
          tag=""; prerelease=""; title=""
          msg=$(git log -1 --pretty=%s)
          internal=$(sed -n 's/^version = "\([^"]*\)"/\1/p' src/pyproject.toml | head -1)
          if [[ ! "$internal" =~ ^[0-9]+$ ]]; then
            echo "Expected a numeric internal project version, got: $internal" >&2
            exit 1
          fi
          release="R$internal"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # An explicit channel always wins over the selected ref or its subject.
            if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
              tag="$release"; prerelease=false
            elif [[ "$RELEASE_CHANNEL" == "preview" ]]; then
              tag="${release}-preview"
              prerelease=true; title="FH-DualSense-Enhanced ${release} Preview"
            else
              echo "Unsupported release channel: $RELEASE_CHANNEL" >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF" =~ ^refs/tags/(R[0-9]+)-preview$ ]]; then
            tag="${BASH_REMATCH[1]}-preview"
            prerelease=true; title="FH-DualSense-Enhanced ${BASH_REMATCH[1]} Preview"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/(R[0-9]+)$ ]]; then
            # R-series tag push -> stable
            tag="${BASH_REMATCH[1]}"; prerelease=false
          elif [[ "$GITHUB_REF" =~ ^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?)$ ]]; then
            # legacy tag push -> stable
            tag="${GITHUB_REF#refs/tags/}"; prerelease=false; title="$tag"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Unknown tags must not inherit a release channel from the commit.
            echo "Ignoring unsupported release tag: $GITHUB_REF"
          elif [[ "$msg" =~ (^|[^[:alnum:]_])prerelease($|[^[:alnum:]_]) ]]; then
            tag="${release}-preview"
            prerelease=true; title="FH-DualSense-Enhanced ${release} Preview"
          elif [[ "$msg" =~ (^|[^[:alnum:]_])release[[:space:]]+(R[0-9]+)($|[^[:alnum:]_.-]) ]]; then
            # explicit R-series stable release commit
            tag="${BASH_REMATCH[2]}"; prerelease=false
          elif [[ "$msg" =~ (^|[^[:alnum:]_])release[[:space:]]+(v[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?)($|[^[:alnum:]_.-]) ]]; then
            # explicit legacy stable release commit
            tag="${BASH_REMATCH[2]}"; prerelease=false; title="$tag"
          fi

          if [[ "$tag" =~ ^R([0-9]+)(-preview)?$ ]]; then
            requested="${BASH_REMATCH[1]}"
            if [[ "$requested" != "$internal" ]]; then
              echo "Refusing $tag: src/pyproject.toml declares R$internal" >&2
              exit 1
            fi
            if ! grep -Fq "## Enhanced R$internal 中文说明" .github/workflows/release.yml \
              || ! grep -Fq "## Enhanced R$internal English notes" .github/workflows/release.yml; then
              echo "Refusing $tag: bilingual release notes are not prepared for R$internal" >&2
              exit 1
            fi
          fi

          if [[ "$tag" =~ ^R[0-9]+$ ]]; then
            title="FH-DualSense-Enhanced $tag"
          elif [[ "$tag" == "v1.6.2.post1" ]]; then
            title="FH-DualSense-Enhanced 1.6.2 Enhanced R1"
          elif [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)\.post([0-9]+)$ ]]; then
            title="FH-DualSense-Enhanced ${BASH_REMATCH[1]} Enhanced R${BASH_REMATCH[2]}"
          fi

          echo "tag=$tag"               >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "title=$title"           >> "$GITHUB_OUTPUT"
          echo "windows_asset=FH-DualSense-Enhanced-${release}.exe" >> "$GITHUB_OUTPUT"

      - name: Move rolling tag
        if: steps.parse.outputs.tag && steps.parse.outputs.prerelease == 'true'
        env:
          TAG: ${{ steps.parse.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin "refs/tags/$TAG" --force

  # MARK: zuv bundle ------------------------------------------------------
  bundle:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.tag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Build zuv bundle
        run: |
          mkdir -p release
          uvx --from "zuv==0.5.6" zuv build src -o release/FH-DualSense-Enhanced.zuv.py \
            --update-repo "$GITHUB_REPOSITORY"
          cp win_start.bat linux_start.sh LICENSE docs/THIRD_PARTY_NOTICES.md release/

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: release/

  # MARK: Windows standalone EXE -----------------------------------------
  exe:
    runs-on: windows-latest
    needs: prepare
    if: needs.prepare.outputs.tag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Build FH-DualSense-Enhanced EXE
        shell: pwsh
        run: |
          & "$Env:GITHUB_WORKSPACE\packaging\windows\build_exe.bat"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify EXE checksum sidecar
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "$Env:GITHUB_WORKSPACE\packaging\windows\dist\FH-DualSense-Enhanced-R*.exe")
          if ($files.Count -ne 1) { throw "Expected one canonical R-series EXE, found $($files.Count)" }
          uv run --no-project python "$Env:GITHUB_WORKSPACE\packaging\windows\write_sha256.py" --check $files[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: |
            packaging/windows/dist/FH-DualSense-Enhanced-*.exe
            packaging/windows/dist/FH-DualSense-Enhanced-*.exe.sha256

  # MARK: Linux standalone ELF -------------------------------------------
  elf:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.tag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # The ELF bundles the xorg tray backend; audio uses system PortAudio.
      - name: Install system audio library
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2

      - name: Build FH-DualSense-Enhanced (ELF)
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          internal=$(sed -n 's/^version = "\([^"]*\)"/\1/p' src/pyproject.toml | head -1)
          bash "$GITHUB_WORKSPACE/packaging/linux/build_elf.sh"
          built="$GITHUB_WORKSPACE/packaging/linux/dist/FH-DualSense-Enhanced-R$internal"
          target="$GITHUB_WORKSPACE/packaging/linux/dist/FH-DualSense-Enhanced-$tag"
          if [[ "$built" != "$target" ]]; then
            mv "$built" "$target"
          fi
          echo "Built packaging/linux/dist/FH-DualSense-Enhanced-$tag"

      - uses: actions/upload-artifact@v4
        with:
          name: elf
          path: packaging/linux/dist/FH-DualSense-Enhanced-*

  # MARK: combined release -----------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [prepare, bundle, exe, elf]
    if: needs.prepare.outputs.tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: elf
          path: release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.title }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: false
          body: |
            ## Enhanced R12 中文说明

            Enhanced R12 改进 Xbox App 模式下的手柄按键响应，并集成实体 DualSense 隔离。

            ### 更新内容

            - **手柄输入**：改进蓝牙 ABXY 短按，以及使用键鼠后首次按键切回手柄的处理；虚拟 Xbox 360 手柄在短暂输入空档中保持连接。
            - **一键安装并隔离**：Xbox App 模式必须使用 HidHide。总览的“快速入口”显示安装进度、驱动与实体手柄隐藏状态。缺少驱动时，点击安装会下载并校验官方 HidHide 1.5.230 安装器，经 Windows UAC 批准后安装。已安装时不会重复下载。
            - **自动配置**：虚拟 Xbox 手柄就绪后，FHDS 自动放行自身、隐藏当前实体 DualSense，并在现有隐藏规则只涉及 DualSense 时开启 Device hiding，无需在官方配置界面手动勾选。已有其他设备规则或特殊反向配置时，FHDS 会提示检查。官方配置界面存在时仍可从快速入口打开。
            - **输入保护与恢复**：确认实体手柄已隐藏前，虚拟手柄只发送中立输入，软件内 Xbox App 游戏启动按钮保持禁用。FHDS 退出时清理自己添加的隐藏规则，保留用户原有规则；意外退出后的自有残留规则会在下次启动时清理。安装后可能需要重启 Windows，首次隐藏后可能需要重连手柄或重启游戏。
            - **验收状态**：蓝牙 ABXY 连按两次及 Xbox App 游戏内键鼠/手柄反复切换的效果仍需实体手柄与游戏实测。

            ### Windows 独立 EXE（推荐）

            下载 `${{ needs.prepare.outputs.windows_asset }}`。EXE 已包含 Python 和应用运行依赖；Xbox App 所需的 HidHide 驱动按需安装。

            ### ZUV / Linux 备用方式

            Windows 可使用 `win_start.bat`，Linux 可使用 `linux_start.sh`，也可以手动下载 `FH-DualSense-Enhanced.zuv.py`。Linux 独立文件为 `${{ format('FH-DualSense-Enhanced-{0}', needs.prepare.outputs.tag) }}`；内置 EXE 更新只支持 Windows 独立版。
            Linux 上若遇到 HID 权限不足，请按仓库中的 [`70-dualsense.rules`](https://github.com/piereacy/FH-DualSense-Enhanced/blob/main/packaging/linux/70-dualsense.rules) 配置 udev 权限。

            ### 基本设置

            - 在 Forza Horizon 中开启 Data Out，设置为 `127.0.0.1:5300`，并关闭游戏内振动。
            - Xbox App 版请在软件内选择 `XBOX 版`，并避免同时让 Steam Input 或 DS4Windows 接管手柄。
            - Xbox App 模式请在总览的“快速入口”确认 HidHide 已安装且当前实体 DualSense 已隐藏。

            ## Enhanced R12 English notes

            Enhanced R12 improves controller button response in Xbox App mode and integrates physical DualSense isolation.

            ### What's new

            - **Controller input**: improves handling of short ABXY presses over Bluetooth and the first controller press after mouse or keyboard use. The virtual Xbox 360 controller stays connected through brief input gaps.
            - **One-click installation and isolation**: Xbox App mode requires HidHide. Overview -> Quick access shows installation progress, driver status, and physical controller hiding status. When the driver is missing, Install downloads and verifies the official HidHide 1.5.230 installer, then installs it after Windows UAC approval. An existing installation is not downloaded again.
            - **Automatic configuration**: once the virtual Xbox controller is ready, FHDS allows itself to see the device, hides the current physical DualSense, and enables Device hiding when existing hiding rules only target DualSense. No manual checkbox is needed in the official client. FHDS prompts for review if other devices or inverse configuration are present. The official client remains available from Quick access when installed.
            - **Input protection and recovery**: until the physical controller is confirmed hidden, the virtual controller sends only neutral input and the in-app Xbox App game launch button stays disabled. FHDS removes only its own hiding rules on exit and preserves existing user rules; its rules left by an interrupted exit are cleaned up on the next launch. Installation may require a Windows restart; first-time hiding may require reconnecting the controller or restarting the game.
            - **Validation status**: the double-tap ABXY and repeated mouse/controller switching symptoms still need testing with a physical controller in the Xbox App game.

            ### Windows standalone EXE (recommended)

            Download `${{ needs.prepare.outputs.windows_asset }}`. It includes Python and the app's runtime dependencies; the HidHide driver required for Xbox App is installed on demand.

            ### ZUV / Linux fallback

            Windows users may use `win_start.bat`, Linux users may use `linux_start.sh`, or either platform may download `FH-DualSense-Enhanced.zuv.py` manually. The standalone Linux asset is `${{ format('FH-DualSense-Enhanced-{0}', needs.prepare.outputs.tag) }}`. Built-in EXE replacement is available only in the Windows standalone build.
            On Linux, if HID access is denied, configure udev permissions with [`70-dualsense.rules`](https://github.com/piereacy/FH-DualSense-Enhanced/blob/main/packaging/linux/70-dualsense.rules).

            ### Basic setup

            - Enable Forza Data Out at `127.0.0.1:5300` and disable in-game vibration.
            - For Xbox App, select `Xbox App` inside FH-DualSense-Enhanced and do not let Steam Input or DS4Windows claim the controller at the same time.
            - In Xbox App mode, confirm in Overview -> Quick access that HidHide is installed and the current physical DualSense is hidden.
          files: release/*
